<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kripery | Kontekst dzieła</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">K</div>
      <div>
        <p class="eyebrow">RODOWÓD · KULTURA</p>
        <h1>Kontekst dzieła</h1>
      </div>
    </header>

    <main>
      <section class="image-section" aria-labelledby="image-heading">
        <div class="section-heading">
          <h2 id="image-heading">Obraz ze strony</h2>
          <button class="text-button" id="refresh-images" type="button">Skanuj stronę</button>
        </div>
        <label class="visually-hidden" for="image-select">Wybierz obraz ze strony</label>
        <select id="image-select" aria-label="Wybierz obraz ze strony">
          <option value="">Wybierz obraz lub kliknij go na stronie</option>
        </select>
        <label class="upload-label" for="image-file">Albo przeanalizuj własny obraz</label>
        <input class="visually-hidden" id="image-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
        <div class="preview" id="preview">
          <div class="preview-empty" id="preview-empty">Wybierz obraz, aby sprawdzić jego nazwę i poszukać informacji.</div>
          <img id="preview-image" alt="" hidden>
        </div>
        <p class="filename" id="filename">Nie wybrano obrazu</p>
        <button class="button button-primary" id="search-button" type="button" disabled>
          <span aria-hidden="true">⌕</span> Odkryj historię obrazu
        </button>
      </section>

      <section class="result-section" aria-live="polite" aria-busy="false">
        <div class="section-heading result-heading">
          <h2>Informacje</h2>
          <span class="source-label" id="source-label">GEMINI FLASH</span>
        </div>
        <div class="result" id="result">
          <p class="result-placeholder">Dopasowany tytuł, autor i historia pojawią się tutaj.</p>
        </div>
      </section>
    </main>

    <footer>
      <span class="status-dot" aria-hidden="true"></span>
      <span id="connection-status">Gotowe do sprawdzenia</span>
    </footer>

    <script src="../config.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
