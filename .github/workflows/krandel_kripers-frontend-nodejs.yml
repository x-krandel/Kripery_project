name: Build and deploy Node.js app to Azure Web App - kripers-frontend-nodejs

on:
  push:
    branches:
      - 'krandel'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci, build, prune
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Stage release folder
        working-directory: ./frontend
        run: |
          mkdir ../release
          cp -r dist server.js package.json package-lock.json node_modules ../release/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          retention-days: 1
          path: release

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2A9F53C9E6F54A6681D86C31D8368FB7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6DB02DB2D43045DF85E426DD12A0EBF8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5CA1F872D5604DB78D07F6C225C7F4A5 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kripers-frontend-nodejs'
          slot-name: 'Production'
          package: .
