name: Build and deploy Python app to Azure Web App - kripers-backend-python

on:
  push:
    branches:
      - 'krandel'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and check that the app imports
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
          python -c "import app.main"
        working-directory: ./backend

      # The war-loss dataset and demo images live in data/ at the repo root; the app
      # finds them in backend/data when deployed (index_lost and seed need them).
      - name: Bundle data/ with the app
        run: cp -r data backend/data

      # Without antenv: App Service builds its own environment from requirements.txt
      # (SCM_DO_BUILD_DURING_DEPLOYMENT=true), and the venv with torch is gigabytes.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            backend/
            !backend/antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5E55EC531267415C88CA74F03DCB1939 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B81BAE3D026B4C3D9D38BFB039B18D79 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CBD27E830304498BA73D2A2003860324 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'kripers-backend-python'
          slot-name: 'Production'
          package: .
          # One worker only: the WebSocket hub and the auction loop live in process memory.
          startup-command: 'python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1'
